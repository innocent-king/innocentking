<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapeball - Add Players Mid Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#020617;color:#fff;max-width:500px;margin:auto;padding:8px;overflow-x:hidden}h1{text-align:center;color:#facc15;font-size:20px;padding:8px}.card{background:#1e293b;border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid #334155}.row{display:flex;gap:8px}input,select{width:100%;min-width:0;padding:10px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-weight:700;text-align:center;outline:none}.team{flex:1;min-width:0;background:#0f172a;border-radius:14px;padding:10px;text-align:center;border:2px solid #334155}.team.active{border-color:#facc15;box-shadow:0 0 12px #facc1566}.score{font-size:38px;font-weight:900}.ov{color:#94a3b8;font-size:13px}.batting{background:#facc15;color:#000;font-weight:900;padding:10px;border-radius:10px;text-align:center;margin:10px 0}.freehit{background:#ef4444;color:#fff;padding:8px;border-radius:8px;text-align:center;font-weight:900;display:none;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}.balls{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;margin:8px 0}.ball{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;border:2px solid #000}.b0{background:#334155}.b1{background:#e2e8f0;color:#000}.b4{background:#22c55e}.b6{background:#a855f7}.bW{background:#fbbf24;color:#000}.bOUT{background:#ef4444}.bNB{background:#fb923c;color:#000}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.btn{padding:18px 0;border:none;border-radius:14px;font-size:20px;font-weight:900;cursor:pointer}.btn:disabled,.small:disabled{opacity:.25;pointer-events:none}.c0{background:#334155;color:#fff}.c1{background:#e2e8f0;color:#000}.c4{background:#22c55e;color:#fff}.c6{background:#a855f7;color:#fff}.cWD{background:#fbbf24;color:#000}.cOUT{background:#ef4444;color:#fff}.small{padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:8px}.stats div{background:#0f172a;padding:7px;border-radius:10px;font-size:13px}.stats b{color:#facc15;display:block;font-size:10px}.target{background:linear-gradient(90deg,#facc15,#f59e0b);color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900;font-size:17px;margin-top:8px}.history{font-size:12px;color:#cbd5e1;max-height:120px;overflow:auto;margin-top:8px;background:#0f172a;padding:8px;border-radius:8px;white-space:pre-line}.share{background:#25D366;color:#fff;width:100%;padding:14px;border-radius:12px;border:none;font-weight:900;font-size:16px;margin-top:10px}.viewbox{background:#0f172a;border:1px dashed #facc15;padding:10px;border-radius:10px;margin-top:8px;white-space:pre-line}.viewbox b{color:#facc15}#winnerOverlay{display:none;position:fixed;inset:0;width:100%;height:100%;background:#000e;z-index:9999;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;overflow:hidden}#winnerOverlay.show{display:flex;animation:pop .4s}@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}.trophy{font-size:80px;animation:bounce 1s infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.winnerText{font-size:28px;font-weight:900;color:#facc15;margin:15px 0}.winnerScore{font-size:15px;color:#fff;background:#1e293b;padding:12px;border-radius:12px;margin:10px 0;line-height:1.6;max-width:90%}.confetti{position:absolute;width:8px;height:8px;animation:fall 3s linear infinite;top:-10px;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.saveBadge{background:#22c55e;color:#000;font-size:9px;font-weight:900;padding:3px 7px;border-radius:20px;margin-left:6px}
</style></head><body>
<div id="winnerOverlay"><div class="trophy">🏆</div><div class="winnerText" id="winnerName"></div><div class="winnerScore" id="winnerDetail"></div><button class="small" style="background:#facc15;color:#000;padding:14px 28px;font-size:16px;margin-top:12px" onclick="closeWinner()">✖ Close Result</button><button class="small" style="background:#25D366;color:#fff;padding:12px 28px;margin-top:8px" onclick="shareWinner()">📲 WhatsApp Share</button></div>
<h1>🏏 TAPEBALL <span class="saveBadge">CRICKET LIVESCORE ✓</span></h1>
<div class="card">
<div class="row"><input id="teamA" maxlength="40" placeholder="Team A name"><input id="teamB" maxlength="40" placeholder="Team B name"></div>
<div class="row" style="margin-top:8px">
<select id="overSelect" onchange="changeOvers()" style="background:#facc15;color:#000;font-weight:900">
<option value="2">2 Overs</option><option value="3">3 Overs</option><option value="4">4 Overs</option><option value="5" selected>5 Overs</option><option value="6">6 Overs</option><option value="8">8 Overs</option><option value="10">10 Overs</option><option value="20">20 Overs</option>
</select>
<select id="playersSelect" onchange="changePlayers()" style="background:#0ea5e9;color:#fff;font-weight:900">
<option value="6">6 Players</option><option value="7" selected>7 Players</option><option value="8">8 Players</option><option value="9">9 Players</option><option value="10">10 Players</option><option value="11">11 Players</option>
</select>
</div>
<div style="font-size:10px;color:#94a3b8;text-align:center;margin-top:6px">Overs = Match shuru se pehle | Players = Beech me bhi add kar sakte ho</div>
</div>
<div class="card"><div class="row"><div class="team active" id="boxA"><div id="nameA">Team A</div><div class="score" id="scoreA">0/0</div><div class="ov" id="overA">0.0 / 5.0</div></div><div class="team" id="boxB"><div id="nameB">Team B</div><div class="score" id="scoreB">0/0</div><div class="ov" id="overB">0.0 / 5.0</div></div></div><div class="batting" id="batInfo"></div><div class="freehit" id="freeHit">🔥 FREE HIT — Sirf RUN OUT par wicket 🔥</div><div class="balls" id="ballsView"></div><div class="stats"><div><b>CRR</b><span id="crr">0.00</span></div><div><b>RRR</b><span id="rrr">-</span></div><div><b>Extras</b><span id="extras">0</span></div><div><b>Balls Left</b><span id="ballsLeft">30</span></div></div><div class="target" id="targetBox" style="display:none"></div><div class="row" style="margin-top:10px"><button class="small" style="flex:1;background:#facc15;color:#000" onclick="viewFirst()">👁️ 1ST INNINGS</button><button class="small" style="flex:1;background:#e2e8f0;color:#000" onclick="viewSecond()">👁️ 2ND INNINGS</button></div><div class="viewbox"><b>📋 FULL SCORECARD:</b><br><span id="fullScoreText"></span></div><div class="history" id="overHistory"></div></div>
<div class="card"><div class="grid"><button class="btn c0 runBtn" onclick="addRun(0)">0</button><button class="btn c1 runBtn" onclick="addRun(1)">1</button><button class="btn c1 runBtn" onclick="addRun(2)">2</button><button class="btn c1 runBtn" onclick="addRun(3)">3</button><button class="btn c4 runBtn" onclick="addRun(4)">4</button><button class="btn c6 runBtn" onclick="addRun(6)">6</button><button class="btn cWD runBtn" onclick="addExtra('WD')">WD</button><button class="btn cOUT runBtn" onclick="addWicket()">OUT</button></div><div class="row" style="margin-top:8px"><button class="small runBtn" style="flex:1;background:#fb923c" onclick="addExtra('NB')">NO BALL</button><button class="small runBtn" style="flex:1;background:#a78bfa" onclick="addExtra('BYE')">BYE</button><button class="small" style="flex:1;background:#475569;color:#fff" onclick="undo()">↩ UNDO</button></div><div class="row" style="margin-top:8px"><button class="small" style="flex:1;background:#0ea5e9;color:#fff" onclick="switchInnings()">SWITCH INNINGS</button><button class="small" style="flex:1;background:#7f1d1d;color:#fff" onclick="resetAll()">RESET ALL</button></div><button class="share" onclick="shareWA()">📲 WhatsApp Result Bhejo</button></div>
<script>
const STORE='tapeball_players_add_v7';
let teams={A:newTeam('Team A'),B:newTeam('Team B')};let bat='A',inn=1,target=0,currentOver=[],historyStack=[],isFreeHit=false,firstInningsData=null,firstCurrentOver=[],matchOver=false,OVER_LIMIT=5,TOTAL=30,MAX_PLAYERS=7;
function newTeam(name){return {name,runs:0,wickets:0,balls:0,extras:0,overs:[]}}
function el(id){return document.getElementById(id)}
function safeName(s,fallback){return (s||'').replace(/[<>]/g,'').trim().slice(0,40)||fallback}
function snapshot(){return JSON.parse(JSON.stringify({teams,bat,inn,target,currentOver,isFreeHit,firstInningsData,firstCurrentOver,matchOver,OVER_LIMIT,TOTAL,MAX_PLAYERS}))}
function saveState(){historyStack.push(snapshot());if(historyStack.length>100)historyStack.shift()}
function saveAll(){try{localStorage.setItem(STORE,JSON.stringify({...snapshot(),teamAInput:el('teamA').value,teamBInput:el('teamB').value}))}catch(e){}}
function handleTeamName(){teams.A.name=safeName(el('teamA').value,'Team A');teams.B.name=safeName(el('teamB').value,'Team B');update()}
function loadAll(){try{const raw=localStorage.getItem(STORE);if(!raw)return;const d=JSON.parse(raw);if(!d||!d.teams||!d.teams.A||!d.teams.B)return;teams=d.teams;bat=d.bat==='B'?'B':'A';inn=d.inn===2?2:1;target=Number(d.target)||0;currentOver=Array.isArray(d.currentOver)?d.currentOver:[];isFreeHit=!!d.isFreeHit;firstInningsData=d.firstInningsData||null;firstCurrentOver=Array.isArray(d.firstCurrentOver)?d.firstCurrentOver:[];matchOver=!!d.matchOver;OVER_LIMIT=[2,3,4,5,6,8,10,20].includes(Number(d.OVER_LIMIT))?Number(d.OVER_LIMIT):5;TOTAL=OVER_LIMIT*6;MAX_PLAYERS=[6,7,8,9,10,11].includes(Number(d.MAX_PLAYERS))?Number(d.MAX_PLAYERS):7;el('teamA').value=d.teamAInput||teams.A.name||'';el('teamB').value=d.teamBInput||teams.B.name||'';el('overSelect').value=OVER_LIMIT;el('playersSelect').value=MAX_PLAYERS;}catch(e){}}
function hasStarted(){return teams.A.balls>0||teams.B.balls>0||teams.A.runs>0||teams.B.runs>0||teams.A.wickets>0||teams.B.wickets>0||inn===2}
function changeOvers(){const n=Number(el('overSelect').value);if(![2,3,4,5,6,8,10,20].includes(n))return;if(hasStarted()){alert('Match shuru ho chuka hai. Overs badalne ke liye RESET ALL karein.');el('overSelect').value=OVER_LIMIT;return}saveState();OVER_LIMIT=n;TOTAL=n*6;update()}

// NAYA PLAYERS LOGIC - BEECH ME BHI ADD KAR SAKTE HO
function changePlayers(){
const p=Number(el('playersSelect').value);
if(![6,7,8,9,10,11].includes(p))return;
const maxWicketsNow=Math.max(teams.A.wickets, teams.B.wickets);

if(p < maxWicketsNow){
alert('Nahi ho sakta! '+maxWicketsNow+' wickets gir chuki hain, '+p+' players kaise kar sakte ho?\nPlayers barha sakte ho, kam nahi.');
el('playersSelect').value=MAX_PLAYERS;
return;
}
if(p < MAX_PLAYERS && hasStarted()){
if(!confirm('Players '+MAX_PLAYERS+' se '+p+' kar rahe ho. Score waisa hi rahega. Continue?')){
el('playersSelect').value=MAX_PLAYERS;
return;
}
}
if(p > MAX_PLAYERS && hasStarted()){
if(!confirm('Player add kar rahe ho! '+MAX_PLAYERS+' se '+p+' players.\nScore same rahega, bas wickets limit barh jayegi. OK?')){
el('playersSelect').value=MAX_PLAYERS;
return;
}
}
saveState();
MAX_PLAYERS=p;
if(matchOver && maxWicketsNow < MAX_PLAYERS){
matchOver=false;
unlockButtons();
closeWinner();
}
update();
}

function finishOverIfNeeded(t){if(t.balls>0&&t.balls%6===0){t.overs.push([...currentOver]);currentOver=[]}}
function addRun(r){if(matchOver)return showWinnerAgain();const t=teams[bat];if(t.balls>=TOTAL){alert('Overs complete hain.');return}if(t.wickets>=MAX_PLAYERS){alert(MAX_PLAYERS+' wickets gir chuki hain — all out! Players add karo agar player aya hai.');return}saveState();t.runs+=r;t.balls++;currentOver.push({v:r,t:'run'});isFreeHit=false;finishOverIfNeeded(t);update();checkWin()}
function addExtra(type){if(matchOver)return showWinnerAgain();const t=teams[bat];if(t.balls>=TOTAL){alert('Overs complete hain.');return}if(t.wickets>=MAX_PLAYERS){alert('All out! Player add karo.');return}if(type==='BYE'){const raw=prompt('Bye ke kitne runs?','1');if(raw===null)return;const runs=Number(raw);if(!Number.isInteger(runs)||runs<1||runs>6){alert('1 se 6 tak valid');return}saveState();t.runs+=runs;t.extras+=runs;t.balls++;currentOver.push({v:'B'+runs,t:'bye'});finishOverIfNeeded(t);isFreeHit=false;update();checkWin();return}saveState();if(type==='WD'){t.runs++;t.extras++;currentOver.push({v:'WD',t:'wide'});}else if(type==='NB'){t.runs++;t.extras++;currentOver.push({v:'NB',t:'nb'});isFreeHit=true}update();checkWin()}
function addWicket(){if(matchOver)return showWinnerAgain();const t=teams[bat];if(t.balls>=TOTAL){alert('Overs complete hain.');return}if(t.wickets>=MAX_PLAYERS){alert(MAX_PLAYERS+' wickets gir chuki hain — all out! Players add karo.');return}const how=prompt('Wicket kaise? BOWLED, CATCH, RUNOUT','CATCH');if(how===null||!how.trim())return;const kind=how.trim().toUpperCase();if(isFreeHit&&kind!=='RUNOUT'){alert('FREE HIT hai! Sirf RUNOUT');return}saveState();t.wickets++;t.balls++;currentOver.push({v:'W',t:'out'});isFreeHit=false;finishOverIfNeeded(t);update();checkWin()}
function checkWin(fromLoad=false){if(inn!==2){saveAll();return}const t=teams[bat],need=target-t.runs,allOut=t.wickets>=MAX_PLAYERS,oversDone=t.balls>=TOTAL;if(need<=0){matchOver=true;const wicketsLeft=Math.max(0,MAX_PLAYERS-t.wickets),ballsLeft=Math.max(0,TOTAL-t.balls);showWinner(`${t.name} JEET GAYA!`,`${t.name} won by ${wicketsLeft} wickets<br><b>${t.runs}/${t.wickets}</b> (${overs(t.balls)} Ov)<br>Target ${target} tha<br>${ballsLeft} balls left<br>Players: ${MAX_PLAYERS}<br><br>Vs ${firstInningsData.name}: ${firstInningsData.runs}/${firstInningsData.wickets}`,fromLoad)}else if(oversDone||allOut){matchOver=true;const margin=Math.max(0,target-t.runs-1),winner=firstInningsData?.name||teams[bat==='A'?'B':'A'].name;showWinner(`${winner} JEET GAYA!`,`${winner} won by ${margin} runs<br><b>${firstInningsData.name}: ${firstInningsData.runs}/${firstInningsData.wickets}</b> (${overs(firstInningsData.balls)} Ov)<br><b>${t.name}: ${t.runs}/${t.wickets}</b> (${overs(t.balls)} Ov)<br>Reason: ${allOut?'All Out ('+MAX_PLAYERS+' Wkts)':'Overs Khatam'}<br>Target: ${target}<br>Players: ${MAX_PLAYERS}`,fromLoad)}else{saveAll();return}lockButtons();saveAll()}
function showWinner(title,detail,fromLoad=false){el('winnerName').textContent='🏆 '+title+' 🏆';el('winnerDetail').innerHTML=detail; if(!fromLoad){el('winnerOverlay').classList.add('show');createConfetti()}}
function createConfetti(){const o=el('winnerOverlay');o.querySelectorAll('.confetti').forEach(x=>x.remove());for(let i=0;i<35;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#facc15','#22c55e','#ef4444','#a855f7','#0ea5e9'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()*1.2+'s';c.style.animationDuration=(1.5+Math.random()*2)+'s';o.appendChild(c)}}
function lockButtons(){document.querySelectorAll('.runBtn').forEach(b=>b.disabled=true)}function unlockButtons(){document.querySelectorAll('.runBtn').forEach(b=>b.disabled=false)}function showWinnerAgain(){if(matchOver)el('winnerOverlay').classList.add('show')}
function closeWinner(){el('winnerOverlay').classList.remove('show');el('winnerOverlay').querySelectorAll('.confetti').forEach(e=>e.remove())}
function shareWinner(){shareText('🏏 TAPEBALL RESULT 🏏\n'+el('winnerName').textContent+'\n'+el('winnerDetail').innerText)}
function restore(s){teams=s.teams;bat=s.bat;inn=s.inn;target=s.target;currentOver=s.currentOver;isFreeHit=s.isFreeHit;firstInningsData=s.firstInningsData;firstCurrentOver=s.firstCurrentOver||[];matchOver=s.matchOver;OVER_LIMIT=s.OVER_LIMIT;TOTAL=s.TOTAL;MAX_PLAYERS=s.MAX_PLAYERS||7;el('overSelect').value=OVER_LIMIT;el('playersSelect').value=MAX_PLAYERS;if(matchOver)lockButtons();else unlockButtons();closeWinner();update();if(matchOver)checkWin(true)}
function undo(){if(!historyStack.length){alert('Undo ke liye kuch nahi!');return}restore(historyStack.pop())}
function switchInnings(){if(matchOver){alert('Match khatam! RESET ALL karein.');return}if(inn===1){if(teams[bat].balls===0&&teams[bat].runs===0&&teams[bat].wickets===0){alert('Pehle first innings mein koi ball/run record karein.');return}saveState();firstInningsData=JSON.parse(JSON.stringify(teams[bat]));firstInningsData.overLimit=OVER_LIMIT;firstCurrentOver=[...currentOver];target=teams[bat].runs+1;bat=bat==='A'?'B':'A';inn=2;currentOver=[];isFreeHit=false;alert('1st Innings: '+firstInningsData.name+' - '+firstInningsData.runs+'/'+firstInningsData.wickets+'\nTarget: '+target+'\nPlayers: '+MAX_PLAYERS);update();checkWin()}else alert('Already 2nd innings')}
function resetAll(){if(!confirm('SARA DATA DELETE? Pakka reset?'))return;localStorage.removeItem(STORE);const a=safeName(el('teamA').value,'Team A'),b=safeName(el('teamB').value,'Team B');teams={A:newTeam(a),B:newTeam(b)};bat='A';inn=1;target=0;currentOver=[];historyStack=[];isFreeHit=false;firstInningsData=null;firstCurrentOver=[];matchOver=false;TOTAL=OVER_LIMIT*6;unlockButtons();closeWinner();update()}
function overs(balls){return Math.floor(balls/6)+'.'+(balls%6)}
function viewFirst(){const d=firstInningsData||(inn===1?teams[bat]:null);if(!d){alert('1st innings nahi hai.');return}const lines=(d.overs||[]).map((o,i)=>`Over ${i+1}: ${o.map(x=>x.v).join(' ')}`);if(firstCurrentOver.length)lines.push('Incomplete: '+firstCurrentOver.map(x=>x.v).join(' '));else if(!firstInningsData&&currentOver.length)lines.push('Current: '+currentOver.map(x=>x.v).join(' '));alert(`1ST INNINGS DETAIL\nTeam: ${d.name}\nPlayers: ${MAX_PLAYERS}\nScore: ${d.runs}/${d.wickets}\nOvers: ${overs(d.balls)} / ${d.overLimit||OVER_LIMIT}.0\nExtras: ${d.extras}\n\n${lines.join('\n')}`)}
function viewSecond(){if(inn===1){alert('2nd innings shuru nahi hui!');return}const t=teams[bat];alert(`2ND INNINGS\nTeam: ${t.name}\nPlayers: ${MAX_PLAYERS}\nScore: ${t.runs}/${t.wickets}\nOvers: ${overs(t.balls)} / ${OVER_LIMIT}.0\nTarget: ${target}\nNeed: ${Math.max(0,target-t.runs)} runs in ${Math.max(0,TOTAL-t.balls)} balls\nWickets left: ${Math.max(0,MAX_PLAYERS-t.wickets)}`)}
function addBallChip(parent,b){const d=document.createElement('div');d.className='ball '+(b.t==='run'?(b.v===4?'b4':b.v===6?'b6':b.v===0?'b0':'b1'):b.t==='out'?'bOUT':b.t==='nb'?'bNB':'bW');d.textContent=b.v;parent.appendChild(d)}
function update(){const a=safeName(el('teamA').value,teams.A.name||'Team A'),b=safeName(el('teamB').value,teams.B.name||'Team B');teams.A.name=a;teams.B.name=b;el('nameA').textContent=a;el('nameB').textContent=b;el('scoreA').textContent=teams.A.runs+'/'+teams.A.wickets;el('scoreB').textContent=teams.B.runs+'/'+teams.B.wickets;el('overA').textContent=overs(teams.A.balls)+' / '+((firstInningsData&&firstInningsData.name===teams.A.name)?firstInningsData.overLimit:OVER_LIMIT)+'.0';el('overB').textContent=overs(teams.B.balls)+' / '+((firstInningsData&&firstInningsData.name===teams.B.name)?firstInningsData.overLimit:OVER_LIMIT)+'.0';el('boxA').classList.toggle('active',bat==='A'&&!matchOver);el('boxB').classList.toggle('active',bat==='B'&&!matchOver);el('batInfo').textContent=matchOver?'🏁 MATCH KHATAM':`Batting: ${teams[bat].name} — ${inn===1?'1st':'2nd'} Inn (${OVER_LIMIT} Over, ${MAX_PLAYERS} Players)`;el('extras').textContent=teams[bat].extras;el('ballsLeft').textContent=Math.max(0,TOTAL-teams[bat].balls);el('crr').textContent=teams[bat].balls?(teams[bat].runs/(teams[bat].balls/6)).toFixed(2):'0.00';el('freeHit').style.display=isFreeHit?'block':'none';const tb=el('targetBox');if(inn===2){tb.style.display='block';const need=Math.max(0,target-teams[bat].runs),left=Math.max(0,TOTAL-teams[bat].balls);el('rrr').textContent=left>0&&need>0?(need/(left/6)).toFixed(2):'0.00';tb.textContent=matchOver?'🏁 MATCH KHATAM':need<=0?`🎉 ${teams[bat].name} JEET GAYA!`:`${need} Runs Chahiye ${left} Balls Pe`}else{tb.style.display='none';el('rrr').textContent='-'}const bv=el('ballsView');bv.replaceChildren();currentOver.forEach(x=>addBallChip(bv,x));const oh=el('overHistory');oh.textContent='Over History:\n';const ovs=teams[bat].overs||[];if(!ovs.length&&!currentOver.length)oh.textContent+='Abhi koi over nahi';else{ovs.forEach((ov,i)=>oh.textContent+=`Over ${i+1}: ${ov.map(x=>x.v).join(' ')}\n`);if(currentOver.length)oh.textContent+='Current: '+currentOver.map(x=>x.v).join(' ')}const fst=el('fullScoreText');if(firstInningsData){fst.textContent=`${firstInningsData.name}: ${firstInningsData.runs}/${firstInningsData.wickets} (${overs(firstInningsData.balls)}/${firstInningsData.overLimit||OVER_LIMIT} Ov)\n${teams[bat].name}: ${teams[bat].runs}/${teams[bat].wickets} (${overs(teams[bat].balls)}/${OVER_LIMIT} Ov) — Target ${target} — ${MAX_PLAYERS} Players`}else fst.textContent=`${teams.A.name}: ${teams.A.runs}/${teams.A.wickets} (${overs(teams.A.balls)})\n${teams.B.name}: ${teams.B.runs}/${teams.B.wickets} (${overs(teams.B.balls)})\nMatch: ${OVER_LIMIT} Overs, ${MAX_PLAYERS} Players`;saveAll();if(matchOver)lockButtons()}
function shareText(msg){const url='https://wa.me/?text='+encodeURIComponent(msg);window.open(url,'_blank','noopener,noreferrer')}
function shareWA(){shareText(`🏏 TAPEBALL ${OVER_LIMIT} Overs, ${MAX_PLAYERS} Players RESULT 🏏\n\n${teams.A.name}: ${teams.A.runs}/${teams.A.wickets} (${overs(teams.A.balls)} Ov)\n${teams.B.name}: ${teams.B.runs}/${teams.B.wickets} (${overs(teams.B.balls)} Ov)\nTarget: ${target}\n${el('fullScoreText').innerText}`)}
