<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty Kick Counter</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0f172a;color:white;min-height:100vh;padding:15px}
  h1{text-align:center;margin:10px 0 5px;font-size:26px}
  p.sub{text-align:center;color:#94a3b8;margin-bottom:15px}
  .teams{display:flex;gap:12px;max-width:700px;margin:0 auto}
  .team{flex:1;background:#1e293b;border-radius:16px;padding:15px;text-align:center;border:2px solid #334155}
  .team.a{border-color:#22c55e}
  .team.b{border-color:#3b82f6}
  .team input{background:#0f172a;border:1px solid #475569;color:white;padding:8px;border-radius:8px;width:100%;text-align:center;font-size:18px;font-weight:bold;outline:none}
  .score{font-size:55px;font-weight:900;margin:10px 0}
  .dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:28px}
  .dot{width:28px;height:28px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-size:14px}
  .dot.goal{background:#22c55e}
  .dot.miss{background:#ef4444}
  .controls{max-width:700px;margin:15px auto;background:#1e293b;padding:15px;border-radius:16px;text-align:center}
  .round{font-size:18px;margin-bottom:12px}
  .round b{color:#facc15}
  .turn{font-size:15px;color:#94a3b8;margin-bottom:12px}
  .btn{padding:13px 18px;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin:5px;width:45%}
  .goalBtn{background:#22c55e;color:white}
  .missBtn{background:#ef4444;color:white}
  .undoBtn{background:#f59e0b;color:black;width:95%;margin-top:8px}
  .resetBtn{background:#475569;color:white;width:95%;margin-top:8px}
  #winner{font-size:24px;font-weight:900;color:#facc15;margin-top:10px;display:none}
  .history{max-width:700px;margin:15px auto;background:#1e293b;padding:12px;border-radius:12px;font-size:14px;color:#cbd5e1}
</style>
</head>
<body>

<h1>⚽ Penalty Kick Counter</h1>
<p class="sub">5 Rounds Shootout • Goal / Miss Count</p>

<div class="teams">
  <div class="team a">
    <input id="teamAName" value="Team A">
    <div class="score" id="scoreA">0</div>
    <div class="dots" id="dotsA"></div>
    <div id="takenA" style="font-size:12px;color:#94a3b8;margin-top:6px">Kicks: 0 / 5</div>
  </div>
  <div class="team b">
    <input id="teamBName" value="Team B">
    <div class="score" id="scoreB">0</div>
    <div class="dots" id="dotsB"></div>
    <div id="takenB" style="font-size:12px;color:#94a3b8;margin-top:6px">Kicks: 0 / 5</div>
  </div>
</div>

<div class="controls">
  <div class="round">Round: <b id="roundText">1</b> / 5</div>
  <div class="turn" id="turnText">Team A ki bari hai</div>
  <button class="btn goalBtn" onclick="kick(true)">✅ GOAL</button>
  <button class="btn missBtn" onclick="kick(false)">❌ MISS</button>
  <br>
  <button class="btn undoBtn" onclick="undo()">↩️ Undo Last Kick</button>
  <button class="btn resetBtn" onclick="resetGame()">🔄 Reset Match</button>
  <div id="winner"></div>
</div>

<div class="history" id="history"><b>History:</b><br>Abhi koi kick nahi hui.</div>

<script>
let kicksA = [];
let kicksB = [];
let history = [];
let turnA = true;
let gameOver = false;

function updateUI(){
  let scoreA = kicksA.filter(x=>x).length;
  let scoreB = kicksB.filter(x=>x).length;
  document.getElementById('scoreA').innerText = scoreA;
  document.getElementById('scoreB').innerText = scoreB;
  document.getElementById('dotsA').innerHTML = kicksA.map(x=>`<div class="dot ${x?'goal':'miss'}">${x?'⚽':'✕'}</div>`).join('');
  document.getElementById('dotsB').innerHTML = kicksB.map(x=>`<div class="dot ${x?'goal':'miss'}">${x?'⚽':'✕'}</div>`).join('');
  document.getElementById('takenA').innerText = `Kicks: ${kicksA.length} / 5`;
  document.getElementById('takenB').innerText = `Kicks: ${kicksB.length} / 5`;

  let round = Math.max(kicksA.length, kicksB.length);
  if(round===0) round=1;
  if(round>5) round=5;
  document.getElementById('roundText').innerText = round;

  let nameA = document.getElementById('teamAName').value || 'Team A';
  let nameB = document.getElementById('teamBName').value || 'Team B';

  if(gameOver){
    document.getElementById('turnText').innerText = 'Match Khatam!';
  } else {
    document.getElementById('turnText').innerText = (turnA ? nameA : nameB) + ' ki bari hai';
  }

  // Check winner after 5-5
  if(kicksA.length===5 && kicksB.length===5){
    gameOver = true;
    let w = document.getElementById('winner');
    w.style.display='block';
    if(scoreA>scoreB) w.innerText = `🏆 ${nameA} Jeet Gaya! ${scoreA} - ${scoreB}`;
    else if(scoreB>scoreA) w.innerText = `🏆 ${nameB} Jeet Gaya! ${scoreB} - ${scoreA}`;
    else w.innerText = `🤝 Draw! Sudden Death - Agli Kick Faisla Karegi`;
    if(scoreA===scoreB){
      gameOver=false;
      document.getElementById('turnText').innerText = 'Sudden Death! ' + (turnA ? nameA : nameB) + ' ki bari';
    }
  } else {
    document.getElementById('winner').style.display='none';
  }

  // Sudden death check
  if(kicksA.length>5 && kicksB.length>5 && kicksA.length===kicksB.length){
    if(scoreA!==scoreB){
      gameOver=true;
      let w=document.getElementById('winner');
      w.style.display='block';
      w.innerText = scoreA>scoreB ? `🏆 ${nameA} Jeet Gaya!` : `🏆 ${nameB} Jeet Gaya!`;
    }
  }

  document.getElementById('history').innerHTML = '<b>History:</b><br>' + (history.length? history.join('<br>') : 'Abhi koi kick nahi hui.');
}

function kick(isGoal){
  if(gameOver) return;
  let nameA = document.getElementById('teamAName').value || 'Team A';
  let nameB = document.getElementById('teamBName').value || 'Team B';
  if(turnA){
    kicksA.push(isGoal);
    history.unshift(`${nameA} - Round ${kicksA.length}: ${isGoal?'GOAL ⚽':'MISS ❌'}`);
  } else {
    kicksB.push(isGoal);
    history.unshift(`${nameB} - Round ${kicksB.length}: ${isGoal?'GOAL ⚽':'MISS ❌'}`);
  }
  turnA = !turnA;
  updateUI();
}

function undo(){
  if(history.length===0) return;
  gameOver=false;
  document.getElementById('winner').style.display='none';
  // Last kick was opposite of current turn
  if(!turnA){
    // last was A
    kicksA.pop();
  } else {
    kicksB.pop();
  }
  history.shift();
  turnA = !turnA;
  updateUI();
}

function resetGame(){
  kicksA=[]; kicksB=[]; history=[]; turnA=true; gameOver=false;
  document.getElementById('winner').style.display='none';
  updateUI();
}

updateUI();
</script>
</body>
</html>
