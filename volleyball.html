<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty Kick Counter</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#0f172a;color:white;display:flex;justify-content:center;padding:15px}
  .box{width:100%;max-width:480px;background:#1e293b;border-radius:20px;padding:20px;text-align:center}
  h1{margin:0;font-size:22px}
  p{color:#94a3b8;font-size:13px}
  .teams{display:flex;gap:12px;margin:20px 0}
  .team{flex:1;background:#0f172a;border-radius:15px;padding:15px}
  .team input{width:100%;background:#334155;border:none;color:white;text-align:center;font-size:18px;font-weight:bold;padding:8px;border-radius:10px;outline:none}
  .score{font-size:50px;font-weight:900;margin:10px 0}
  .balls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:28px}
  .ball{width:26px;height:26px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-size:14px}
  .goal{background:#22c55e !important}
  .miss{background:#ef4444 !important}
  .btns{display:flex;gap:10px;margin-top:10px}
  button{flex:1;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
  .g{background:#22c55e;color:white}
  .m{background:#ef4444;color:white}
  .turn{margin:15px 0;background:#f59e0b;color:black;padding:10px;border-radius:12px;font-weight:bold}
  #winner{font-size:20px;font-weight:900;color:#facc15;margin:10px 0;min-height:28px}
  .reset{background:#64748b;color:white;width:100%;margin-top:10px}
  .service{background:#3b82f6;color:white;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <h1>⚽ PENALTY KICK COUNTER</h1>
  <p>5 - 5 Kicks Shootout</p>

  <div id="winner"></div>
  <div class="turn" id="turnText">Team A ki Bari Hai</div>

  <div class="teams">
    <div class="team">
      <input id="teamAName" value="TEAM A">
      <div class="score" id="scoreA">0</div>
      <div class="balls" id="ballsA"></div>
      <div>Kicks: <span id="kickA">0</span>/5</div>
    </div>
    <div class="team">
      <input id="teamBName" value="TEAM B">
      <div class="score" id="scoreB">0</div>
      <div class="balls" id="ballsB"></div>
      <div>Kicks: <span id="kickB">0</span>/5</div>
    </div>
  </div>

  <div class="btns">
    <button class="g" onclick="addKick(true)">✅ GOAL</button>
    <button class="m" onclick="addKick(false)">❌ MISS</button>
  </div>
  <button class="service" onclick="serviceChange()">🔄 SERVICE CHANGE</button>
  <button class="reset" onclick="resetGame()">🔄 Dobara Shuru Karo</button>
</div>

<script>
  let scoreA=0, scoreB=0, kicksA=0, kicksB=0;
  let turnA=true;
  let historyA=[], historyB=[];

  function addKick(isGoal){
    if(kicksA>=5 && kicksB>=5){
      if(scoreA!==scoreB){ return; }
      // Sudden Death me bhi chalta rahega
    }
    if(turnA){
      kicksA++;
      if(isGoal){ scoreA++; historyA.push('goal'); } else { historyA.push('miss'); }
    } else {
      kicksB++;
      if(isGoal){ scoreB++; historyB.push('goal'); } else { historyB.push('miss'); }
    }
    turnA=!turnA;
    update();
    checkWinner();
  }

  function serviceChange(){
    turnA=!turnA;
    update();
  }

  function update(){
    document.getElementById('scoreA').innerText=scoreA;
    document.getElementById('scoreB').innerText=scoreB;
    document.getElementById('kickA').innerText=kicksA;
    document.getElementById('kickB').innerText=kicksB;
    document.getElementById('ballsA').innerHTML=historyA.map(h=>`<div class="ball ${h}"> ${h==='goal'?'⚽':'✖'} </div>`).join('');
    document.getElementById('ballsB').innerHTML=historyB.map(h=>`<div class="ball ${h}"> ${h==='goal'?'⚽':'✖'} </div>`).join('');
    let nameA=document.getElementById('teamAName').value || 'TEAM A';
    let nameB=document.getElementById('teamBName').value || 'TEAM B';
    document.getElementById('turnText').innerText = turnA ? nameA + ' ki Bari Hai' : nameB + ' ki Bari Hai';
  }

  function checkWinner(){
    let nameA=document.getElementById('teamAName').value || 'TEAM A';
    let nameB=document.getElementById('teamBName').value || 'TEAM B';
    if(kicksA>=5 && kicksB>=5){
      if(scoreA>scoreB){ document.getElementById('winner').innerText='🏆 '+nameA+' JEET GAYA!'; }
      else if(scoreB>scoreA){ document.getElementById('winner').innerText='🏆 '+nameB+' JEET GAYA!'; }
      else { document.getElementById('winner').innerText='⚡ BARABAR! Sudden Death - Agli Kick Faisla Karegi'; }
    }
    // Pehle hi jeet pakki ho jaye
    if(kicksA<5 || kicksB<5){
      let remA=5-kicksA, remB=5-kicksB;
      if(scoreA > scoreB+remB){ document.getElementById('winner').innerText='🏆 '+nameA+' JEET GAYA!'; }
      if(scoreB > scoreA+remA){ document.getElementById('winner').innerText='🏆 '+nameB+' JEET GAYA!'; }
    }
  }

  function resetGame(){
    scoreA=0; scoreB=0; kicksA=0; kicksB=0; turnA=true; historyA=[]; historyB=[];
    document.getElementById('winner').innerText='';
    update();
  }
  update();
</script>
</body>
</html>
