<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSL LIVE Score - Muridke</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.score-box{background:linear-gradient(90deg,#0f172a,#14532d);padding:15px;border-bottom:4px solid #22c55e}
.team{font-size:22px;font-weight:bold}
.runs{font-size:44px;color:#22c55e;font-weight:900;margin:5px 0}
.ov{font-size:16px;color:#facc15}
.fb-box{width:100%;height:85vh;background:#000}
.fb-box iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="score-box">
  <div class="team" id="title">Muridke Super League LIVE</div>
  <div class="runs" id="score">Waiting for Score...</div>
  <div class="ov" id="over">--</div>
</div>
<div class="fb-box">
  <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/share/19hpcCV2m1/&show_text=0&width=560" allowfullscreen></iframe>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAfdtWU8fHz-WQ-JnptfKDHoKcJyP2us4",
  authDomain: "live-score-msl.firebaseapp.com",
  databaseURL: "https://live-score-msl-default-rtdb.firebaseio.com",
  projectId: "live-score-msl",
  storageBucket: "live-score-msl.firebasestorage.app",
  messagingSenderId: "905774460099",
  appId: "1:905774460099:web:6b87f3c1c9fb0a67850676"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
onValue(ref(db,'msl/live'),(snap)=>{
  const d=snap.val(); if(!d) return;
  document.getElementById('title').innerText=d.matchTitle || "MSL LIVE";
  document.getElementById('score').innerText=`${d.team1} ${d.runs}/${d.wickets}`;
  document.getElementById('over').innerText=`Overs: ${d.overs} | ${d.status}`;
});
</script>
</body>
</html>
