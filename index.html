<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSL 10F/W LIVE SCORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#020617;color:#fff;max-width:650px;margin:auto}
.header{background:linear-gradient(90deg,#facc15,#f97316);color:#000;font-weight:900;text-align:center;padding:14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.viewer-badge{background:#000;color:#22c55e;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid #22c55e}
.score-bar{background:linear-gradient(135deg,#1e293b,#0f172a);padding:14px;margin:8px;border-radius:16px;border:1px solid #facc15;display:flex;justify-content:space-between;align-items:center}
.score{font-size:32px;font-weight:900;color:#facc15}
.batting{background:#facc15;color:#000;font-weight:900;padding:10px;border-radius:10px;text-align:center;margin:8px}
.batter-bowler{display:flex;gap:8px;margin:8px}
.batter-bowler div{flex:1;background:#1e293b;border:1px solid #facc15;border-radius:12px;padding:10px;text-align:center}
.batter-bowler b{color:#facc15;font-size:9px;display:block}
.batter-bowler span{font-weight:900;font-size:14px}
.superball{background:linear-gradient(90deg,#a855f7,#ec4899,#facc15);color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:900;margin:8px;animation:blink 0.8s infinite;display:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.8}}
.balls{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#0f172a;margin:8px;border-radius:12px;min-height:44px}
.ball{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;border:2px solid #000}
.b0{background:#334155}.b1{background:#e2e8f0;color:#000}.b4{background:#22c55e}.b6{background:#a855f7}.bW{background:#fbbf24;color:#000}.bOUT{background:#ef4444}.bBYE{background:#38bdf8}.bLB{background:#0ea5e9}.bRO{background:#f97316}.bSUPER{background:linear-gradient(135deg,#facc15,#ec4899);color:#000;border-color:#fff}
.stats-bar{background:#1e293b;margin:8px;padding:12px;border-radius:12px;display:flex;gap:10px;text-align:center;font-size:13px;border:1px solid #334155}
.stats-bar div{flex:1}.stats-bar b{color:#facc15;font-size:16px;display:block}
.history-card{background:#1e293b;margin:8px;border-radius:12px;padding:10px;border:1px solid #334155}
.history-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #0f172a;font-size:12px}
.history-item.wicket{background:#7f1d1d33;border-left:3px solid #ef4444}
/* FACEBOOK LOGIN + VIDEO SEARCH - NAYA */
.fb-card{background:#1e293b;margin:8px;border-radius:12px;padding:12px;border:1px solid #1877F2}
.fb-btn{background:#1877F2;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:900;width:100%;cursor:pointer;font-size:14px}
.fb-btn:hover{background:#166fe5}
.video-search-box{display:flex;gap:6px;margin-top:10px}
.video-search-box input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
.video-search-box button{padding:10px 14px;border-radius:8px;border:none;background:#facc15;color:#000;font-weight:900;cursor:pointer}
.video-frame{margin-top:10px;border-radius:10px;overflow:hidden;background:#000;min-height:200px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="header"><span>🏏 MSL LIVE</span><span class="viewer-badge">👁️ <b id="viewerCount">0</b> Watching</span></div>

<!-- FACEBOOK LOGIN + VIDEO SEARCH - NAYA SECTION - BAKI SAME -->
<div class="fb-card" id="fbCard">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<span style="color:#1877F2;font-weight:900;font-size:13px">📘 Facebook Login & Video Search</span>
<span id="fbStatus" style="color:#22c55e;font-size:11px">Not Logged In</span>
</div>

<div id="fbLoginDiv">
<button class="fb-btn" onclick="fbLogin()">🔵 Login with Facebook</button>
<div style="color:#94a3b8;font-size:10px;margin-top:6px;text-align:center">Login karke video search karo</div>
</div>

<div id="fbLoggedDiv" style="display:none">
<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
<img id="fbPic" src="" style="width:36px;height:36px;border-radius:50%;background:#334155">
<div><b id="fbName" style="font-size:13px">User</b><div style="font-size:10px;color:#22c55e">● Facebook Connected</div></div>
<button onclick="fbLogout()" style="margin-left:auto;background:#7f1d1d;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:10px">Logout</button>
</div>

<div class="video-search-box">
<input id="videoSearchInput" placeholder="Video search: MSL Live, Cricket..." />
<button onclick="searchVideo()">Search</button>
</div>
<div class="video-frame" id="videoFrame">Video yahan ayegi - Search karo</div>
</div>
</div>

<div class="superball" id="superBanner">⚡ SUPER BALL ACTIVE! ⚡</div>
<div class="batting" id="batInfo">Loading...</div>
<div class="batter-bowler"><div><b>BATTER</b><span id="batter">-</span></div><div><b>BOWLER</b><span id="bowler">-</span></div></div>
<div class="score-bar"><div><b id="nameA">Team A</b><div style="font-size:11px;color:#94a3b8" id="overA">0.0</div></div><div class="score" id="scoreA">0/0</div><div>VS</div><div class="score" id="scoreB">0/0</div><div style="text-align:right"><b id="nameB">Team B</b><div style="font-size:11px;color:#94a3b8" id="overB">0.0</div></div></div>
<div class="balls" id="balls"></div>
<div class="stats-bar"><div>CRR<br><b id="crr">0.00</b></div><div>TARGET<br><b id="target">-</b></div><div>NEED<br><b id="need">-</b></div><div>BALLS<br><b id="ballsLeft">30</b></div></div>
<div class="history-card"><div style="color:#facc15;font-weight:900;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between"><span>📜 HISTORY</span><span id="extras">Extras: 0</span></div><div id="history"></div></div>

<!-- FACEBOOK SDK -->
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
<script>
// FACEBOOK LOGIN LOGIC
window.fbAsyncInit = function() {
  FB.init({
    appId      : 'YOUR_FACEBOOK_APP_ID', // <-- Yahan apna App ID dalna hai
    cookie     : true,
    xfbml      : true,
    version    : 'v18.0'
  });
  FB.getLoginStatus(function(response) { checkLoginState(response); });
};

function fbLogin(){
  FB.login(function(response){ checkLoginState(response); }, {scope: 'public_profile,email'});
}
function fbLogout(){
  FB.logout(function(){ 
    document.getElementById('fbLoginDiv').style.display='block';
    document.getElementById('fbLoggedDiv').style.display='none';
    document.getElementById('fbStatus').innerText='Not Logged In';
  });
}
function checkLoginState(res){
  if(res.status==='connected'){
    document.getElementById('fbLoginDiv').style.display='none';
    document.getElementById('fbLoggedDiv').style.display='block';
    document.getElementById('fbStatus').innerText='Logged In';
    FB.api('/me', {fields: 'name,picture'}, function(user){
      document.getElementById('fbName').innerText=user.name;
      if(user.picture) document.getElementById('fbPic').src=user.picture.data.url;
    });
  }
}
function searchVideo(){
  const q = document.getElementById('videoSearchInput').value.trim();
  if(!q) return alert('Search likho');
  const frame = document.getElementById('videoFrame');
  // YouTube search embed - Viewer khud video dekh lega
  frame.innerHTML = `<iframe width="100%" height="220" src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}" frameborder="0" allowfullscreen></iframe>`;
}
// Simple demo login agar Facebook App ID nahi hai
if(typeof FB==='undefined'){
  window.fbLogin = function(){
    const name = prompt('Facebook Name (Demo):')||'Viewer';
    document.getElementById('fbLoginDiv').style.display='none';
    document.getElementById('fbLoggedDiv').style.display='block';
    document.getElementById('fbName').innerText=name;
    document.getElementById('fbStatus').innerText='Logged In (Demo)';
  }
  window.fbLogout = function(){
    document.getElementById('fbLoginDiv').style.display='block';
    document.getElementById('fbLoggedDiv').style.display='none';
    document.getElementById('fbStatus').innerText='Not Logged In';
  }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const cfg={apiKey:"AIzaSyAfdtWU8fHz-WQ-JnptfKDHoKcJyP2us4",authDomain:"live-score-msl.firebaseapp.com",databaseURL:"https://live-score-msl-default-rtdb.firebaseio.com",projectId:"live-score-msl",storageBucket:"live-score-msl.firebasestorage.app",messagingSenderId:"905774460099",appId:"1:905774460099:web:6b87f3c1c9fb0a67850676"};
const app=initializeApp(cfg); const db=getDatabase(app);

const myId = 'viewer_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
const myRef = ref(db,'msl/viewers/'+myId);
set(myRef,{type:'viewer',time:Date.now()});
onDisconnect(myRef).remove();
window.addEventListener('beforeunload',()=>{set(myRef,null)});

onValue(ref(db,'msl/viewers'),snap=>{
 if(!snap.exists()){document.getElementById('viewerCount').innerText=0;return;}
 const all = Object.values(snap.val());
 const onlyViewers = all.filter(v=>v.type==='viewer').length;
 document.getElementById('viewerCount').innerText=onlyViewers;
});

onValue(ref(db,'msl/pro'),s=>{
 const d=s.val();if(!d)return;
 const a=d.teams.A,b=d.teams.B;
 document.getElementById('nameA').innerText=a.name;document.getElementById('nameB').innerText=b.name;
 document.getElementById('scoreA').innerText=a.runs+'/'+a.wickets;document.getElementById('scoreB').innerText=b.runs+'/'+b.wickets;
 document.getElementById('overA').innerText=Math.floor(a.balls/6)+'.'+a.balls%6+' / '+d.OVER_LIMIT;document.getElementById('overB').innerText=Math.floor(b.balls/6)+'.'+b.balls%6+' / '+d.OVER_LIMIT;
 const cur=d.bat=='A'?a:b;
 document.getElementById('batInfo').innerText=`${cur.name} ${cur.runs}/${cur.wickets} (${Math.floor(cur.balls/6)}.${cur.balls%6} Ov) ${d.target?'Target '+d.target:''}`;
 document.getElementById('superBanner').style.display=d.isSuper?'block':'none';
 document.getElementById('batter').innerText=d.batterName||'-';document.getElementById('bowler').innerText=d.bowlerName||'-';
 document.getElementById('crr').innerText=cur.balls?(cur.runs/(cur.balls/6)).toFixed(2):'0.00';document.getElementById('target').innerText=d.target||'-';document.getElementById('need').innerText=d.inn==2?Math.max(0,d.target-cur.runs):'-';document.getElementById('ballsLeft').innerText=d.TOTAL-cur.balls;document.getElementById('extras').innerText='Extras: '+(cur.extras||0);
 const ballsDiv=document.getElementById('balls');ballsDiv.innerHTML='';(d.currentOver||[]).forEach(x=>{const div=document.createElement('div');let cls='b1';if(x.t=='out')cls='bOUT';else if(x.t=='bye')cls='bBYE';else if(x.t=='lb')cls='bLB';else if(x.t=='wide'||x.t=='nb')cls='bW';else if(x.t=='ro')cls='bRO';else if(x.super)cls='bSUPER';else if(x.v==0)cls='b0';else if(x.v==4||x.v==8)cls='b4';else if(x.v==6||x.v==12)cls='b6';div.className='ball '+cls;div.innerText=x.v+(x.super?'⚡':'');ballsDiv.appendChild(div);});
 const histDiv=document.getElementById('history');
 if(d.fullBallHistory && d.fullBallHistory.length){histDiv.innerHTML='';d.fullBallHistory.slice(0,20).forEach(h=>{const item=document.createElement('div');item.className='history-item '+(h.t=='out'||h.t=='ro'?'wicket':'');item.innerHTML=`<span><b style="color:#facc15">${h.over}</b> ${h.v} - ${h.batter} vs ${h.bowler}</span><span style="color:#94a3b8;font-size:10px">${h.t}</span>`;histDiv.appendChild(item);});} else {histDiv.innerHTML='<span style="color:#64748b;font-size:11px">No balls yet</span>';}
});
</script>
</body>
</html>
