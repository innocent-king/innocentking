<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Trebuchet MS", Arial, sans-serif;

  background:
    radial-gradient(circle at 20% 20%, #ffd1e3, transparent 35%),
    radial-gradient(circle at 80% 80%, #ffc1dc, transparent 35%),
    linear-gradient(135deg, #fff0f6, #ffd6e7);

  animation: backgroundMove 8s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
  0% {
    background-position: 0% 0%;
  }

  100% {
    background-position: 100% 100%;
  }
}


/* =========================
   BACKGROUND PARTICLES
========================= */

.particle {
  position: fixed;
  bottom: -30px;
  pointer-events: none;
  opacity: 0.6;
  animation: particleUp linear forwards;
}

@keyframes particleUp {

  0% {
    transform: translateY(0) scale(0.5);
    opacity: 0;
  }

  20% {
    opacity: 0.7;
  }

  100% {
    transform: translateY(-110vh) scale(1.2);
    opacity: 0;
  }

}


/* =========================
   MAIN CARD
========================= */

.container {
  width: 90%;
  max-width: 450px;

  text-align: center;

  padding: 38px 22px;

  background: rgba(255,255,255,0.45);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  border: 1px solid rgba(255,255,255,0.7);

  border-radius: 30px;

  box-shadow:
    0 20px 60px rgba(255,59,120,0.2),
    inset 0 0 25px rgba(255,255,255,0.5);

  animation: cardAppear 1s ease;
}

@keyframes cardAppear {

  0% {
    opacity: 0;
    transform: translateY(40px) scale(0.85);
  }

  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}


/* =========================
   EMOJI
========================= */

.emoji {
  font-size: 75px;

  margin-bottom: 15px;

  filter:
    drop-shadow(
      0 8px 15px
      rgba(255,59,120,0.25)
    );

  animation:
    bounce 1.5s infinite,
    glow 2s ease-in-out infinite alternate;
}

@keyframes bounce {

  0%,100% {
    transform:
      translateY(0)
      rotate(0deg);
  }

  50% {
    transform:
      translateY(-12px)
      rotate(3deg);
  }

}

@keyframes glow {

  from {
    filter:
      drop-shadow(
        0 5px 10px
        rgba(255,59,120,0.2)
      );
  }

  to {
    filter:
      drop-shadow(
        0 5px 25px
        rgba(255,59,120,0.7)
      );
  }

}


/* =========================
   STYLISH MAIN HEADING
========================= */

h1 {
  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  font-size: 31px;

  font-weight: 900;

  letter-spacing: 0.6px;

  line-height: 1.3;

  margin-bottom: 16px;

  background:
    linear-gradient(
      90deg,
      #ff1761,
      #ff4f87,
      #ff9cbd,
      #ff1761
    );

  background-size: 300% auto;

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  filter:
    drop-shadow(
      0 4px 10px
      rgba(255,59,120,0.25)
    );

  animation:
    gradientText 4s linear infinite,
    headingFloat 2.5s ease-in-out infinite alternate;
}

@keyframes gradientText {

  0% {
    background-position: 0% center;
  }

  100% {
    background-position: 300% center;
  }

}

@keyframes headingFloat {

  0% {
    transform: translateY(0);
  }

  100% {
    transform: translateY(-4px);
  }

}


/* =========================
   MESSAGE
========================= */

p {
  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  font-size: 19px;

  font-weight: 700;

  letter-spacing: 0.4px;

  line-height: 1.5;

  color: #70495b;

  margin-bottom: 30px;

  text-shadow:
    0 2px 8px
    rgba(255,59,120,0.18);
}

#message {
  animation:
    messageAppear 0.8s ease,
    messageFloat 3s ease-in-out infinite alternate;
}

@keyframes messageAppear {

  0% {
    opacity: 0;
    transform: translateY(12px);
  }

  100% {
    opacity: 1;
    transform: translateY(0);
  }

}

@keyframes messageFloat {

  0% {
    transform: translateY(0);
  }

  100% {
    transform: translateY(-2px);
  }

}


/* =========================
   BUTTONS
========================= */

.buttons {
  display: flex;

  justify-content: center;

  align-items: center;

  gap: 20px;

  min-height: 60px;
}

button {
  border: none;

  border-radius: 15px;

  padding: 14px 30px;

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  font-size: 18px;

  font-weight: 900;

  letter-spacing: 0.7px;

  cursor: pointer;

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease;

  box-shadow:
    0 8px 20px
    rgba(0,0,0,0.12);
}


/* =========================
   YES BUTTON
========================= */

#yes {
  background:
    linear-gradient(
      135deg,
      #ff3b78,
      #ff1761
    );

  color: white;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,0.15);

  animation:
    yesPulse 2s infinite;
}

#yes:hover {
  transform: scale(1.1);

  box-shadow:
    0 10px 30px
    rgba(255,23,97,0.45);
}

@keyframes yesPulse {

  0%,100% {
    box-shadow:
      0 5px 15px
      rgba(255,59,120,0.25);
  }

  50% {
    box-shadow:
      0 5px 30px
      rgba(255,59,120,0.55);
  }

}


/* =========================
   NO BUTTON
========================= */

#no {
  background:
    rgba(255,255,255,0.9);

  color: #ff3b78;

  text-shadow:
    0 1px 3px
    rgba(255,59,120,0.15);
}

#no:hover {
  transform: scale(1.05);
}


/* =========================
   SUCCESS SCREEN
========================= */

.success {
  display: none;

  animation:
    successAppear 0.8s ease;
}

.success h2 {

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  font-size: 40px;

  font-weight: 900;

  letter-spacing: 1px;

  margin: 15px 0;

  background:
    linear-gradient(
      90deg,
      #ff1761,
      #ff4f87,
      #ff9cbd,
      #ff1761
    );

  background-size: 300% auto;

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  filter:
    drop-shadow(
      0 5px 12px
      rgba(255,59,120,0.3)
    );

  animation:
    successGradient 3s linear infinite,
    yay 1s ease-in-out infinite alternate;
}

@keyframes successGradient {

  0% {
    background-position: 0% center;
  }

  100% {
    background-position: 300% center;
  }

}

@keyframes successAppear {

  0% {
    transform:
      scale(0.3)
      rotate(-10deg);

    opacity: 0;
  }

  70% {
    transform:
      scale(1.1)
      rotate(3deg);
  }

  100% {
    transform:
      scale(1)
      rotate(0);

    opacity: 1;
  }

}

@keyframes yay {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.08);
  }

}


/* Success paragraph */

.success p {

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  font-size: 19px;

  font-weight: 700;

  color: #70495b;

  text-shadow:
    0 2px 8px
    rgba(255,59,120,0.15);

  animation:
    successMessage 1s ease;
}

@keyframes successMessage {

  0% {
    opacity: 0;
    transform: scale(0.8);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }

}


/* =========================
   FLOATING HEARTS
========================= */

.heart {
  position: fixed;

  bottom: -40px;

  font-size: 25px;

  pointer-events: none;

  animation:
    floatUp 4s linear forwards;

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,59,120,0.5)
    );
}

@keyframes floatUp {

  0% {
    transform:
      translateY(0)
      rotate(0deg)
      scale(0.7);

    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  50% {
    transform:
      translateY(-50vh)
      rotate(180deg)
      scale(1);
  }

  100% {
    transform:
      translateY(-110vh)
      rotate(360deg)
      scale(1.3);

    opacity: 0;
  }

}


/* =========================
   SPARKLES
========================= */

.sparkle {
  position: fixed;

  pointer-events: none;

  font-size: 18px;

  animation:
    sparkleAnim 1s ease-out forwards;
}

@keyframes sparkleAnim {

  0% {
    transform:
      scale(0)
      rotate(0deg);

    opacity: 1;
  }

  100% {
    transform:
      scale(1.5)
      rotate(180deg);

    opacity: 0;
  }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  .container {
    padding: 30px 18px;
  }

  h1 {
    font-size: 26px;
  }

  p {
    font-size: 17px;
  }

  .emoji {
    font-size: 65px;
  }

  button {
    padding: 13px 25px;
    font-size: 17px;
  }

}
</style>
</head>


<body>

<div class="container">

  <!-- QUESTION -->

  <div id="question">

    <div class="emoji">
      🥺❤️
    </div>

    <h1>
      Kya Tum Mujh Se Pyar Karti Ho?
    </h1>

    <p id="message">
      Sach sach batana... 🥺💕
    </p>

    <div class="buttons">

      <button id="yes">
        Yes ❤️
      </button>

      <button id="no">
        No 😭
      </button>

    </div>

  </div>


  <!-- SUCCESS -->

  <div class="success" id="success">

    <div class="emoji">
      🥰❤️
    </div>

    <h2>
      Yayyy! ❤️
    </h2>

    <p>
      Mujhe pata tha tum Yes bolo gi! 😭💕
    </p>

  </div>

</div>


<script>

const yesButton =
  document.getElementById("yes");

const noButton =
  document.getElementById("no");

const question =
  document.getElementById("question");

const success =
  document.getElementById("success");

const message =
  document.getElementById("message");

let noCount = 0;


/* =========================
   BACKGROUND PARTICLES
========================= */

function createBackgroundParticles() {

  const particle =
    document.createElement("div");

  particle.className =
    "particle";

  particle.innerHTML =
    ["♡", "♥", "✨", "•", "💕"][
      Math.floor(Math.random() * 5)
    ];

  particle.style.left =
    Math.random() * 100 + "vw";

  particle.style.fontSize =
    (10 + Math.random() * 20) + "px";

  particle.style.animationDuration =
    (5 + Math.random() * 6) + "s";

  document.body.appendChild(
    particle
  );

  setTimeout(() => {
    particle.remove();
  }, 11000);
}

setInterval(
  createBackgroundParticles,
  500
);


/* =========================
   NO BUTTON
========================= */

function moveNoButton() {

  const buttonWidth =
    noButton.offsetWidth;

  const buttonHeight =
    noButton.offsetHeight;

  const maxX =
    window.innerWidth -
    buttonWidth -
    15;

  const maxY =
    window.innerHeight -
    buttonHeight -
    15;

  const x =
    10 +
    Math.random() *
    Math.max(maxX - 10, 10);

  const y =
    10 +
    Math.random() *
    Math.max(maxY - 10, 10);

  noButton.style.position =
    "fixed";

  noButton.style.left =
    x + "px";

  noButton.style.top =
    y + "px";
}


/* =========================
   NO CLICK
========================= */

noButton.addEventListener(
  "click",
  function() {

    noCount++;

    if (noCount === 1) {

      message.innerHTML =
        "Dobara Soch Kar Batao 🥺❤️";

    }

    else if (noCount === 2) {

      message.innerHTML =
        "Please Maan Jao Na 🥺💕";

    }

    else {

      message.innerHTML =
        "Ab No Pakarna Mushkil Hai 😂❤️";

      moveNoButton();

    }

  }
);


/* =========================
   NO ESCAPE
========================= */

noButton.addEventListener(
  "mouseenter",
  function() {

    if (noCount >= 2) {
      moveNoButton();
    }

  }
);

noButton.addEventListener(
  "touchstart",
  function(e) {

    if (noCount >= 2) {

      e.preventDefault();

      moveNoButton();

    }

  }
);


/* =========================
   YES CLICK
========================= */

yesButton.addEventListener(
  "click",
  function() {

    question.style.display =
      "none";

    success.style.display =
      "block";

    createHearts();

    createSparkles();

    createExtraHearts();

  }
);


/* =========================
   FLOATING HEARTS
========================= */

function createHearts() {

  for (let i = 0; i < 45; i++) {

    setTimeout(() => {

      const heart =
        document.createElement("div");

      heart.className =
        "heart";

      heart.innerHTML =
        [
          "❤️",
          "💕",
          "💖",
          "💗",
          "💓",
          "💞"
        ][
          Math.floor(
            Math.random() * 6
          )
        ];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (3 + Math.random() * 4) + "s";

      heart.style.fontSize =
        (18 + Math.random() * 25) + "px";

      document.body.appendChild(
        heart
      );

      setTimeout(() => {
        heart.remove();
      }, 7000);

    }, i * 80);

  }

}


/* =========================
   SPARKLES
========================= */

function createSparkles() {

  for (let i = 0; i < 35; i++) {

    setTimeout(() => {

      const sparkle =
        document.createElement("div");

      sparkle.className =
        "sparkle";

      sparkle.innerHTML =
        ["✨", "💫", "⭐", "💕"][
          Math.floor(
            Math.random() * 4
          )
        ];

      sparkle.style.left =
        Math.random() * 100 + "vw";

      sparkle.style.top =
        Math.random() * 100 + "vh";

      document.body.appendChild(
        sparkle
      );

      setTimeout(() => {
        sparkle.remove();
      }, 1000);

    }, i * 100);

  }

}


/* =========================
   EXTRA HEART BURST
========================= */

function createExtraHearts() {

  const emojis =
    ["❤️", "💗", "💖", "💕", "💞"];

  for (let i = 0; i < 25; i++) {

    const heart =
      document.createElement("div");

    heart.className =
      "heart";

    heart.innerHTML =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];

    heart.style.left =
      "50vw";

    heart.style.bottom =
      "45vh";

    heart.style.fontSize =
      (18 + Math.random() * 25) + "px";

    heart.style.animationDuration =
      (2 + Math.random() * 2) + "s";

    document.body.appendChild(
      heart
    );

    setTimeout(() => {
      heart.remove();
    }, 4500);

  }

}

</script>

</body>
</html>
