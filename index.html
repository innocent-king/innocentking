<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body {
    min-height: 100vh; overflow-x: hidden; overflow-y: auto;
    display: flex; justify-content: center; align-items: center;
    padding: 25px 0; font-family: "Poppins", Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, #ffd1e3, transparent 35%),
                radial-gradient(circle at 80% 80%, #ffc1dc, transparent 35%),
                linear-gradient(135deg, #fff0f6, #ffd6e7);
    background-size: 200% 200%; animation: backgroundMove 8s ease-in-out infinite alternate;
}
@keyframes backgroundMove {0%{background-position: 0% 0%;} 100%{background-position: 100% 100%;}}

.container {
    width: 90%; max-width: 480px; text-align: center; padding: 40px 25px;
    background: rgba(255,255,255,0.55); backdrop-filter: blur(20px);
    border-radius: 35px; box-shadow: 0 25px 70px rgba(255,59,120,0.25); position: relative; z-index: 5;
}

.emoji {font-size: 80px; margin-bottom: 15px;}
h1 {font-size: 28px; font-weight: 900; margin-bottom: 16px; background: linear-gradient(90deg, #ff1761, #ff4f87); -webkit-background-clip: text; background-clip: text; color: transparent;}
p {font-size: 18px; font-weight: 700; color: #70495b; margin-bottom: 30px;}
.buttons {display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 60px; position: relative; height: 60px;}
button {border: none; border-radius: 18px; padding: 15px 32px; font-size: 18px; font-weight: 900; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.12);}

#yes {background: linear-gradient(135deg, #ff3b78, #ff1761); color: white;}
#yes:hover {transform: scale(1.1);}
#no {background: #fff; color: #ff3b78; position: absolute;}

#no.hidden {display: none;}

.success {display: none;}
.success h2 {font-size: 42px; font-weight: 900; margin: 15px 0; color: #ff1761;}
.contact-name {font-size: 24px; font-weight: 900; color: #ff1761; margin: 12px 0;}
.whatsapp-btn {display: inline-block; background: #25D366; color: white; text-decoration: none; padding: 14px 28px; border-radius: 15px; font-weight: 900;}
.video-container {display: none; margin-top: 28px;} 
.video-container video {width: 100%; max-height: 400px; border-radius: 20px; background: #000; border: 2px solid #ff9cbd;}

.heart {position: fixed; bottom: -40px; font-size: 25px; pointer-events: none; z-index: 10; animation: floatUp 4s linear forwards;}
@keyframes floatUp {0%{transform: translateY(0) scale(0.7); opacity: 0;} 15%{opacity: 1;} 100%{transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0;}}

/* PASSWORD POPUP */
.password-popup {display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;}
.password-box {background: white; padding: 35px; border-radius: 25px; text-align: center;}
.password-box h3 {color: #ff1761; margin-bottom: 15px; font-size: 22px;}
.password-box input {padding: 12px 18px; border: 2px solid #ff9cbd; border-radius: 12px; font-size: 18px; width: 220px; text-align: center; margin-bottom: 15px;}
.password-box button {background: #ff1761; color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 900; cursor: pointer;}
.error-msg {color: red; font-size: 14px; margin-top: 10px; display: none;}
.attempts {color: #ff1761; font-size: 14px; margin-top: 8px; font-weight: 700;}
</style>
</head>
<body>

<div class="container">
    <div id="question">
        <div class="emoji">🥺❤️</div>
        <h1>Kya Tum Mujh Se Pyar Karti Ho?</h1>
        <p id="message">Sach sach batana... 🥺💕</p>
        <div class="buttons" id="buttonsDiv">
            <button id="yes">Yes ❤️</button>
            <button id="no">No 😭</button>
        </div>
    </div>

    <div class="success" id="success">
        <div class="emoji">🥰❤️</div>
        <h2>Yayyy! ❤️</h2>
        <p>Mujhe pata tha tum Yes bolo gi! 😭💕</p>
        <div class="contact-name">Sadeem Umar</div>
        <div class="countdown">WhatsApp <span id="countNumber">10</span> seconds mein open hoga... 💚</div>
        <a href="https://wa.me/923149793116?text=I%20love%20you%20%E2%9D%A4%EF%B8%8F" target="_blank" class="whatsapp-btn">💬 WhatsApp Pe Baat Kro</a>
        
        <!-- VIDEO WAPIS ADD KAR DIYA -->
        <div class="video-container" id="videoContainer">
            <div style="font-weight:900; color:#ff1761; margin-bottom:12px;">❤️ Sirf Tumhare Liye ❤️</div>
            <video id="loveVideo" controls playsinline preload="auto">
                <source src="./innocentking.mp4" type="video/mp4">
                Your browser does not support video.
            </video>
        </div>
    </div>
</div>

<div class="password-popup" id="passwordPopup">
    <div class="password-box">
        <h3>🔒 Password Daalo</h3>
        <input type="password" id="passwordInput" placeholder="Password">
        <br>
        <button onclick="checkPassword()">Submit</button>
        <div class="attempts" id="attemptsLeft">Attempts: 3</div>
        <div class="error-msg" id="errorMsg">Galat Password!</div>
    </div>
</div>

<script>
const yesButton = document.getElementById("yes");
const noButton = document.getElementById("no");
const buttonsDiv = document.getElementById("buttonsDiv");
const question = document.getElementById("question");
const success = document.getElementById("success");
const message = document.getElementById("message");
const loveVideo = document.getElementById("loveVideo");
const videoContainer = document.getElementById("videoContainer");
const countNumber = document.getElementById("countNumber");
const passwordPopup = document.getElementById("passwordPopup");
const passwordInput = document.getElementById("passwordInput");
const errorMsg = document.getElementById("errorMsg");
const attemptsLeft = document.getElementById("attemptsLeft");

let noCount = 0;
let wrongPassAttempts = 0;
let passwordShown = false;
const MAX_NO_CLICKS = 12;
const MAX_WRONG_PASS = 3; 
const CORRECT_PASSWORD = "03149793";
const whatsappLink = "https://wa.me/923149793116?text=I%20love%20you%20%E2%9D%A4%EF%B8%8F";

function createHearts() {
    for (let i = 0; i < 40; i++) {
        setTimeout(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, i * 80);
    }
}

function moveNoButton() {
    const rect = buttonsDiv.getBoundingClientRect();
    const buttonWidth = noButton.offsetWidth; 
    const buttonHeight = noButton.offsetHeight;
    const maxX = rect.width - buttonWidth - 10;
    const maxY = rect.height - buttonHeight - 10;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    noButton.style.left = x + "px"; 
    noButton.style.top = y + "px";
}

function showSuccessScreen() {
    question.style.display = "none";
    success.style.display = "block";
    videoContainer.style.display = "block"; // VIDEO SHOW
    createHearts();
    try {loveVideo.play();} catch (error) {}
    
    let seconds = 10; countNumber.textContent = seconds;
    const countdownTimer = setInterval(() => {
        seconds--; countNumber.textContent = seconds;
        if (seconds <= 0) {clearInterval(countdownTimer);}
    }, 1000);
    
    setTimeout(() => {window.location.href = whatsappLink;}, 10000);
}

// YES BUTTON
yesButton.addEventListener("click", function() {
    showSuccessScreen();
});

// NO BUTTON
noButton.addEventListener("click", function() {
    noCount++;
    
    if (noCount < 3) {
        message.innerHTML = "Dobara Soch Kar Batao 🥺❤️";
    } else if (noCount < 6) {
        message.innerHTML = "Please Maan Jao Na 🥺💕";
        moveNoButton();
    } else if (noCount < MAX_NO_CLICKS) {
        message.innerHTML = "Pakro mujhe! 😂❤️";
        moveNoButton();
    } else {
        if(!passwordShown){
            passwordShown = true;
            message.innerHTML = "Acha ab Password Se Prove Kro 😏";
            passwordPopup.style.display = "flex";
            passwordInput.value = "";
            errorMsg.style.display = "none";
            wrongPassAttempts = 0;
            attemptsLeft.textContent = `Attempts: ${MAX_WRONG_PASS}`;
            setTimeout(() => passwordInput.focus(), 100);
        }
    }
});

noButton.addEventListener("mouseenter", function() {
    if (noCount >= 3 && noCount < MAX_NO_CLICKS) {moveNoButton();}
});

// PASSWORD CHECK
function checkPassword() {
    if (passwordInput.value === CORRECT_PASSWORD) {
        passwordPopup.style.display = "none";
        passwordShown = false;
        noCount = 6;
        message.innerHTML = "Maan Jao Na Jaan 🥺❤️";
        noButton.style.left = "0px";
        noButton.style.top = "0px";
        setTimeout(moveNoButton, 200);
    } else {
        wrongPassAttempts++;
        errorMsg.style.display = "block";
        let remaining = MAX_WRONG_PASS - wrongPassAttempts;
        attemptsLeft.textContent = `Attempts: ${remaining}`;
        passwordInput.value = "";
        
        if (wrongPassAttempts >= MAX_WRONG_PASS) {
            passwordPopup.style.display = "none";
            noButton.classList.add("hidden");
            message.innerHTML = "apny Password sai ni lagaya 😔";
        }
    }
}

passwordInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {checkPassword();}
});
</script>
</body>
</html>
