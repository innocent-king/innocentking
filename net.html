<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasilpur Pro Speed Test - Accurate</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:15px}
  .box{background:#161616;border:2px solid #25D366;border-radius:20px;max-width:450px;margin:auto;padding:20px}
  h1{color:#25D366;margin:5px}
  .main{font-size:70px;font-weight:bold}
  .live{font-size:14px;color:#00ff88;height:18px}
  .small{font-size:14px;color:#aaa}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
  .card{background:#222;padding:12px;border-radius:12px}
  .card b{font-size:20px;color:#25D366}
  .card span{font-size:12px;color:#bbb}
  button{background:#25D366;border:none;color:#fff;padding:15px 40px;font-size:18px;border-radius:50px;margin-top:20px;cursor:pointer}
  #bar{height:10px;background:#333;border-radius:10px;margin-top:15px;overflow:hidden}
  #fill{height:100%;width:0%;background:#25D366;transition:0.2s}
  .result{margin-top:10px;font-size:13px;color:#00ff88}
</style>
</head>
<body>
<div class="box">
  <h1>⚡ HASILPUR PRO</h1>
  <p class="small">Accurate Speed Test - Speedtest Jaisa</p>
  <div class="main"><span id="mainSpeed">0.00</span> <span style="font-size:20px">Mbps</span></div>
  <div class="live" id="liveSpeed">Ready Hai</div>
  <p id="status">START dabao</p>
  <div id="bar"><div id="fill"></div></div>

  <div class="grid">
    <div class="card">Ping<br><b id="ping">--</b><br><span>ms - Sab Se Kam Wala</span></div>
    <div class="card">Jitter<br><b id="jitter">--</b><br><span>ms</span></div>
    <div class="card">Download<br><b id="down">--</b><br><span>Mbps</span></div>
    <div class="card">Upload<br><b id="up">--</b><br><span>Mbps</span></div>
    <div class="card">Gaming<br><b id="latency">--</b><br><span>PUBG Latency</span></div>
    <div class="card">ISP<br><b id="conn">--</b><br><span id="isp">Checking...</span></div>
  </div>
  <div class="result" id="verdict"></div>
  <button id="btn" onclick="startTest()">START TEST</button>
  <p class="small" style="margin-top:15px">Made by Hasilpur Wala - V2 Accurate</p>
</div>

<script>
// --- 1. ACCURATE PING - 10 baar me sab se kam wala lega ---
async function getAccuratePing(){
  let pings=[];
  for(let i=0;i<10;i++){
    let t1=performance.now();
    await fetch('https://www.google.com/favicon.ico?x='+Math.random(),{mode:'no-cors',cache:'no-store'});
    pings.push(performance.now()-t1);
    await new Promise(r=>setTimeout(r,50));
  }
  pings.sort((a,b)=>a-b);
  let best = pings[0];
  let avg = pings.slice(0,5).reduce((a,b)=>a+b)/5; // top 5 ka average
  let jitter = Math.max(...pings) - Math.min(...pings);
  return {ping: Math.round(avg), jitter: Math.round(jitter), best: Math.round(best)};
}

// --- 2. ACCURATE DOWNLOAD - Stream se live speed ---
async function testDownload(){
  // 4 parallel connections - jaise Speedtest karta hai
  let totalBytes=0;
  let start=performance.now();
  let duration=8000; // 8 second tak test karega
  let active=true;

  async function oneStream(){
    while(active){
      try{
        let res=await fetch('https://speed.cloudflare.com/__down?bytes=25000000&x='+Math.random(),{cache:'no-store'});
        let reader=res.body.getReader();
        while(true){
          let {done,value}=await reader.read();
          if(done) break;
          totalBytes+=value.length;
          let elapsed=(performance.now()-start)/1000;
          if(elapsed>0.5){
            let speed=((totalBytes*8)/elapsed/1000000).toFixed(2);
            document.getElementById('mainSpeed').innerText=speed;
            document.getElementById('liveSpeed').innerText='Live Download: '+speed+' Mbps';
          }
          if(performance.now()-start>duration) break;
        }
      }catch(e){ break; }
    }
  }

  let workers=[oneStream(),oneStream(),oneStream(),oneStream()];
  await new Promise(r=>setTimeout(r,duration));
  active=false;
  await Promise.allSettled(workers);
  let elapsed=(performance.now()-start)/1000;
  // Aakhri 2 second ki speed sab se accurate hoti hai
  return ((totalBytes*8)/elapsed/1000000);
}

// --- 3. ACCURATE UPLOAD ---
async function testUpload(){
  let totalSent=0;
  let start=performance.now();
  let duration=5000;
  let chunk=new Uint8Array(1000000); // 1MB chunk

  async function oneUpload(){
    while(performance.now()-start<duration){
      try{
        await fetch('https://speed.cloudflare.com/__up',{method:'POST',body:chunk,mode:'no-cors',cache:'no-store'});
        totalSent+=chunk.length;
      }catch(e){}
    }
  }
  await Promise.all([oneUpload(),oneUpload()]);
  let elapsed=(performance.now()-start)/1000;
  return ((totalSent*8)/elapsed/1000000);
}

async function startTest(){
  let btn=document.getElementById('btn');
  btn.disabled=true; btn.innerText='Testing...';
  document.getElementById('fill').style.width='10%';
  document.getElementById('status').innerText='Ping Check Ho Raha Hai... (10 Baar)';

  let p=await getAccuratePing();
  document.getElementById('ping').innerText=p.ping+' ms';
  document.getElementById('jitter').innerText=p.jitter+' ms';
  document.getElementById('latency').innerText=p.ping+' ms';

  try{
    let ipData=await fetch('https://ipapi.co/json/').then(r=>r.json());
    document.getElementById('isp').innerText=ipData.org||'Unknown';
    document.getElementById('conn').innerText=ipData.org ? ipData.org.split(' ')[0] : '4G';
  }catch(e){}

  document.getElementById('status').innerText='Download Check Ho Raha Hai... 8 Second';
  document.getElementById('fill').style.width='50%';
  let down=await testDownload();
  document.getElementById('down').innerText=down.toFixed(2)+' Mbps';
  document.getElementById('mainSpeed').innerText=down.toFixed(2);

  document.getElementById('status').innerText='Upload Check Ho Raha Hai... 5 Second';
  document.getElementById('fill').style.width='85%';
  let up=await testUpload();
  document.getElementById('up').innerText=up.toFixed(2)+' Mbps';

  document.getElementById('fill').style.width='100%';
  document.getElementById('status').innerText='Ho Gaya - Accurate Result';
  document.getElementById('liveSpeed').innerText='Test Complete';

  let verdict='';
  if(down>30) verdict='🔥 Zabardast - 4K + Gaming Dono Chalega';
  else if(down>15) verdict='✅ Acha Hai - YouTube HD Aaram Se';
  else if(down>7) verdict='⚠️ Theek Hai - Bas Normal Use';
  else verdict='❌ Slow Hai - Jazz/Zong Ka Signal Check Kar';
  document.getElementById('verdict').innerText=verdict;

  btn.disabled=false; btn.innerText='DOBARA TEST KARO';
}
</script>
</body>
</html>
