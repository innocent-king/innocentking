<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasilpur Pro Speed Test</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:15px}
  .box{background:#161616;border:2px solid #25D366;border-radius:20px;max-width:450px;margin:auto;padding:20px}
  h1{color:#25D366;margin:5px}
  .main{font-size:65px;font-weight:bold}
  .small{font-size:14px;color:#aaa}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
  .card{background:#222;padding:12px;border-radius:12px}
  .card b{font-size:20px;color:#25D366}
  .card span{font-size:12px;color:#bbb}
  button{background:#25D366;border:none;color:#fff;padding:15px 40px;font-size:18px;border-radius:50px;margin-top:20px;cursor:pointer}
  #bar{height:10px;background:#333;border-radius:10px;margin-top:15px;overflow:hidden}
  #fill{height:100%;width:0%;background:#25D366;transition:0.3s}
  .result{margin-top:10px;font-size:13px;color:#00ff88}
</style>
</head>
<body>
<div class="box">
  <h1>⚡ HASILPUR PRO</h1>
  <p class="small">Har Tarah Ki Speed - Ek Hi Jagah</p>
  <div class="main"><span id="mainSpeed">0.00</span> <span style="font-size:20px">Mbps</span></div>
  <p id="status">START dabao</p>
  <div id="bar"><div id="fill"></div></div>

  <div class="grid">
    <div class="card">Ping<br><b id="ping">--</b><br><span>ms</span></div>
    <div class="card">Jitter<br><b id="jitter">--</b><br><span>ms - Kam = Acha</span></div>
    <div class="card">Download<br><b id="down">--</b><br><span>Mbps</span></div>
    <div class="card">Upload<br><b id="up">--</b><br><span>Mbps</span></div>
    <div class="card">Gaming Latency<br><b id="latency">--</b><br><span>PUBG / Free Fire</span></div>
    <div class="card">Connection<br><b id="conn">--</b><br><span id="isp">Checking...</span></div>
  </div>

  <div class="result" id="verdict"></div>
  <button id="btn" onclick="startTest()">START TEST</button>
  <p class="small" style="margin-top:15px">Made by Hasilpur Wala</p>
</div>

<script>
async function getPing(){
  let t1 = performance.now();
  await fetch('https://www.google.com/favicon.ico',{mode:'no-cors',cache:'no-store'});
  return performance.now() - t1;
}

async function startTest(){
  let btn=document.getElementById('btn');
  btn.disabled=true; btn.innerText='Testing...';
  document.getElementById('fill').style.width='10%';
  document.getElementById('status').innerText='Ping Check Ho Raha Hai...';

  // PING + JITTER - 5 baar check
  let pings=[];
  for(let i=0;i<5;i++){ pings.push(await getPing()); }
  let avgPing = pings.reduce((a,b)=>a+b)/pings.length;
  let jitter = Math.max(...pings) - Math.min(...pings);
  document.getElementById('ping').innerText = Math.round(avgPing)+' ms';
  document.getElementById('jitter').innerText = Math.round(jitter)+' ms';
  document.getElementById('latency').innerText = Math.round(avgPing)+' ms';

  // Connection Type
  let connType = navigator.connection ? navigator.connection.effectiveType : '4G / WiFi';
  document.getElementById('conn').innerText = connType.toUpperCase();
  try{
    let ipData = await fetch('https://ipapi.co/json/').then(r=>r.json());
    document.getElementById('isp').innerText = ipData.org || 'Unknown ISP';
  }catch(e){ document.getElementById('isp').innerText='Jazz / Zong / PTCL'; }

  // DOWNLOAD - 25MB
  document.getElementById('status').innerText='Download Check Ho Raha Hai... (25MB)';
  document.getElementById('fill').style.width='50%';
  let dStart=performance.now();
  await fetch('https://speed.cloudflare.com/__down?bytes=25000000',{cache:'no-store'}).then(r=>r.blob());
  let dTime=(performance.now()-dStart)/1000;
  let down=((25*8)/dTime).toFixed(2);
  document.getElementById('down').innerText=down+' Mbps';
  document.getElementById('mainSpeed').innerText=down;

  // UPLOAD - 5MB
  document.getElementById('status').innerText='Upload Check Ho Raha Hai... (5MB)';
  document.getElementById('fill').style.width='80%';
  let data=new Blob([new Uint8Array(5000000)]);
  let uStart=performance.now();
  try{ await fetch('https://speed.cloudflare.com/__up',{method:'POST',body:data,mode:'no-cors'}); }catch(e){}
  let uTime=(performance.now()-uStart)/1000;
  let up=((5*8)/uTime).toFixed(2);
  document.getElementById('up').innerText=up+' Mbps';

  document.getElementById('fill').style.width='100%';
  document.getElementById('status').innerText='Ho Gaya!';

  // VERDICT - Tera net kaisa hai
  let verdict='';
  if(down>20) verdict='🔥 Tera Net Zabardast Hai - 4K Video Chalegi';
  else if(down>10) verdict='✅ Tera Net Acha Hai - YouTube / TikTok Aaram Se Chalega';
  else if(down>5) verdict='⚠️ Tera Net Theek Hai - Bas HD Chalega';
  else verdict='❌ Tera Net Slow Hai - Package Change Kar Le';
  document.getElementById('verdict').innerText=verdict;

  btn.disabled=false; btn.innerText='DOBARA TEST KARO';
}
</script>
</body>
</html>
