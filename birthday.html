<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #ff9a9e, #fecfef, #fad0c4);
    font-family: 'Segoe UI', sans-serif;
  }
  .card{
    background: white;
    padding: 50px 60px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    animation: pop 1s ease;
  }
  @keyframes pop{
    0%{transform: scale(0.5); opacity:0;}
    100%{transform: scale(1); opacity:1;}
  }
  h1{
    font-size: 3.2rem;
    margin:0;
    color: #ff4e50;
  }
  .emoji{
    font-size: 4.5rem;
    animation: bounce 1.2s infinite;
  }
  @keyframes bounce{
    0%,100%{transform: translateY(0);}
    50%{transform: translateY(-12px);}
  }
  p{
    font-size: 1.2rem;
    color: #555;
    margin-top:10px;
  }
  button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#ff4e50;
    color:white;
    font-size:1.1rem;
    cursor:pointer;
  }
  button:hover{
    background:#333;
  }
</style>
</head>
<body>

<div class="card">
  <div class="emoji">🎂</div>
  <h1>Happy Birthday!</h1>
  <p>Wishing you a day full of happiness,</p>
  <p>laughter and beautiful surprises! 🎉</p>
  <p><b>Stay Blessed Always! ✨</b></p>
  <button onclick="alert('Enjoy Your Special Day! 🎈🎁')">Celebrate 🎊</button>
</div>

</body>
</html>
