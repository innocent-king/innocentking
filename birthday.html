<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body {min-height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: "Trebuchet MS", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);}

.card {
  width: 90%;
  max-width: 500px;
  text-align: center;
  padding: 40px 25px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-radius: 30px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.3);
  animation: popIn 1s ease;
  position: relative;
  z-index: 10;
}

@keyframes popIn {
 0% {transform: scale(0.5) rotate(-10deg); opacity: 0;}
 100% {transform: scale(1) rotate(0); opacity: 1;}
}

.cake {font-size: 120px; animation: bounce 2s infinite;}
@keyframes bounce {0%,100% {transform: translateY(0);} 50% {transform: translateY(-20px);}}

h1 {
  font-size: 42px;
  font-weight: 900;
  margin: 20px 0;
  background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientText 3s linear infinite;
}

@keyframes gradientText {
 0% {background-position: 0% center;}
 100% {background-position: 300% center;}
}

.name {
  font-size: 28px;
  font-weight: 900;
  color: #764ba2;
  margin-bottom: 15px;
}

p {font-size: 18px; color: #555; line-height: 1.6; margin-bottom: 20px;}

.btn {
  display: inline-block;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 15px 35px;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 900;
  text-decoration: none;
  box-shadow: 0 10px 30px rgba(102,126,234,0.4);
  transition: transform 0.3s ease;
  cursor: pointer;
  border: none;
  margin: 8px;
}
.btn:hover {transform: scale(1.1);}

/* NEW: CONTACT STYLE */
.contact-section {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 2px dashed #ddd;
  animation: fadeInUp 1s ease 0.8s both;
}
.contact-text {
  font-size: 16px;
  color: #764ba2;
  font-weight: 700;
  margin-bottom: 10px;
}
.whatsapp-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #25D366, #128C7E);
  color: white;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 900;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(37,211,102,0.4);
  transition: transform 0.3s ease;
}
.whatsapp-btn:hover {transform: scale(1.08);}

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(15px); }
 100% { opacity: 1; transform: translateY(0); }
}

.balloon {
  position: fixed;
  bottom: -100px;
  font-size: 60px;
  animation: floatUp 6s linear infinite;
  z-index: 1;
}

@keyframes floatUp {
 0% {transform: translateY(0) rotate(0deg); opacity: 0;}
 10% {opacity: 1;}
 100% {transform: translateY(-120vh) rotate(360deg); opacity: 0;}
}

.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 10px;
  background: #ff6b6b;
  animation: confettiFall 4s linear infinite;
  z-index: 1;
}

@keyframes confettiFall {
 0% {transform: translateY(0) rotate(0deg);}
 100% {transform: translateY(110vh) rotate(720deg);}
}

@media (max-width: 500px) {
  h1 {font-size: 32px;}
  .cake {font-size: 90px;}
  .name {font-size: 22px;}
}
</style>
</head>
<body>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Happy Birthday!</h1>
  <div class="name" id="name">To You ❤️</div>
  <p>Tumhari zindagi har din itni khubsurat ho jitna aaj ka din hai.  
  Allah tumhe hamesha khush rakhe! 🥳💖</p>
  
  <button class="btn" onclick="celebrate()">Celebrate 🎉</button>

  <!-- YE NAYA ADD KIYA HAI -->
  <div class="contact-section">
    <div class="contact-text">From: Sadeem Umar</div>
    <a href="https://wa.me/923149793116" target="_blank" class="whatsapp-btn">
      💬 +92 314 9793116
    </a>
  </div>
</div>

<script>
// NAME YAHAN CHANGE KRO
document.getElementById('name').innerHTML = "Maryam❤️";

// BALLOONS
const colors = ['🎈','🎉','🎊','✨','💖'];
for(let i=0; i<15; i++){
  setTimeout(()=>{
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.innerHTML = colors[Math.floor(Math.random()*colors.length)];
    balloon.style.left = Math.random()*100 + 'vw';
    balloon.style.animationDuration = (4 + Math.random()*3) + 's';
    document.body.appendChild(balloon);
    setTimeout(()=>balloon.remove(), 7000);
  }, i*300);
}

// CONFETTI
function celebrate(){
  for(let i=0; i<100; i++){
    setTimeout(()=>{
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random()*100 + 'vw';
      conf.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
      conf.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(conf);
      setTimeout(()=>conf.remove(), 4000);
    }, i*20);
  }
}
celebrate(); // page load pe bhi confetti
</script>
</body>
</html>
