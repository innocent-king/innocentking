<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Meri Jaan ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Dancing+Script:wght@700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    font-family: 'Poppins', sans-serif;
}

#lockScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    backdrop-filter: blur(10px);
}
.lock-box{
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(30px);
    padding:60px 40px;
    border-radius:30px;
    text-align:center;
    border:2px solid rgba(255,255,255,0.2);
}
.lock-box h2{ color:white; font-size:35px; margin-bottom:30px; font-family: 'Dancing Script', cursive; }
.lock-box input{
    width:250px;
    padding:18px;
    border:none;
    border-radius:50px;
    font-size:25px;
    text-align:center;
    letter-spacing:10px;
    margin-bottom:30px;
    background: rgba(255,255,255,0.9);
}
.lock-box button{
    padding:18px 50px;
    border:none;
    border-radius:50px;
    background: linear-gradient(90deg,#ff006e,#8338ec);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#mainContent{ display:none; }
.container{ width:100%; height:100vh; display:flex; justify-content:center; align-items:center; flex-direction:column; }

/* SCREEN 1 */
.screen1 h1{ font-size:clamp(50px,15vw,100px); color:white; animation: rainbow 4s linear infinite; }
@keyframes rainbow{ 0%{ color:#ff006e } 50%{ color:#3a86ff } 100%{ color:#ff006e } }
.heart-btn{ font-size:150px; margin:40px 0; cursor:pointer; animation: bounce 1s infinite; }
@keyframes bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-30px); } }

/* SCREEN 2 - SCRATCH */
.screen2{ display:none; }
.scratch-wrapper{
    position:relative;
    width:350px;
    height:420px;
}
#scratchCanvas{
    position:absolute;
    top:0;
    left:0;
    border-radius:20px;
    cursor: crosshair;
}
.letter-content{
    width:350px;
    height:420px;
    background: linear-gradient(135deg,#ff9a9e,#fecfef);
    border-radius:20px;
    padding:30px;
    color:#333;
    text-align:center;
    box-shadow:0 30px 80px rgba(255,0,128,.5);
}
.letter-content h2{ font-family: 'Dancing Script', cursive; font-size:40px; color:#d63384; margin-bottom:15px; }
.bear{ font-size:90px; margin:15px 0; animation: wiggle 1s infinite; }
@keyframes wiggle{ 0%,100%{ transform:rotate(-10deg); } 50%{ transform:rotate(10deg); } }
.progress{ color:white; margin-top:15px; font-size:16px; }

/* SCREEN 3 */
.screen3{ display:none; text-align:center; }
.candle{ font-size:80px; cursor:pointer; }
.flame{ animation: flicker.2s infinite alternate; }
@keyframes flicker{ from{ transform:scale(1); } to{ transform:scale(1.3); } }
.blown{ animation: blowOut.8s forwards; }
@keyframes blowOut{ to{ transform: scale(0); opacity:0; } }

/* SCREEN 4 */
.screen4{ display:none; text-align:center; }
.name{ font-family: 'Dancing Script', cursive; font-size:80px; color:white; }
.photo-frame{
    width:280px;
    height:280px;
    border-radius:50%;
    margin:30px auto;
    border:8px solid white;
}
.photo-frame img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }

.btn{
    margin-top:30px;
    padding:18px 50px;
    border:none;
    border-radius:50px;
    background: linear-gradient(90deg,#ff006e,#8338ec);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    display:none; /* hidden by default */
    animation: popIn.5s ease;
}
@keyframes popIn{ from{ transform:scale(0); } to{ transform:scale(1); } }
</style>
</head>
<body>

<!-- PASSWORD -->
<div id="lockScreen">
    <div class="lock-box">
        <h2>Ek Secret Hai 🔐</h2>
        <input type="password" id="passwordInput" placeholder="0824" maxlength="4">
        <br>
        <button onclick="checkPassword()">KHOLO AB!</button>
    </div>
</div>

<!-- MAIN -->
<div id="mainContent">
    <audio id="bgMusic" loop autoplay>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- SCREEN 1 -->
        <div class="screen1" id="s1">
            <h1>SURPRISE!</h1>
            <div class="heart-btn" onclick="next(1)">💥</div>
        </div>

        <!-- SCREEN 2 - SCRATCH CARD -->
        <div class="screen2" id="s2">
            <div class="scratch-wrapper">
                <canvas id="scratchCanvas" width="350" height="420"></canvas>
                <div class="letter-content">
                    <h2>Meri Jaan ❤️</h2>
                    <div class="bear">🧸</div>
                    <p style="font-size:18px; line-height:2;">
                        Tum duniya ki sab se khaas ho.<br>
                        Tumhari 1 smile = meri 100 khushiyan<br>
                        I Love You To The Moon & Back 🌙
                    </p>
                </div>
            </div>
            <p class="progress" id="progressText">70% scratch karo 👆</p>
            <button class="btn" id="nextBtn2" onclick="next(2)">NEXT 🎂</button>
        </div>

        <!-- SCREEN 3 -->
        <div class="screen3" id="s3">
            <h1 style="color:white; font-size:40px;">CAKE PHONKO! 🎂</h1>
            <div class="candle" onclick="blowCandle()">
                <div class="flame" id="flame">🔥</div>
            </div>
            <button class="btn" id="nextBtn3" onclick="next(3)" style="display:none;">LAST WALA 🎁</button>
        </div>

        <!-- SCREEN 4 -->
        <div class="screen4" id="s4">
            <p style="color:white; font-size:20px;">FOR THE ONE I LOVE</p>
            <div class="name">Meri Jaan</div>
            <div class="photo-frame">
                <img src="photo.jpg" alt="love">
            </div>
        </div>
    </div>
</div>

<script>
const CORRECT_PASSWORD = "0824";

function checkPassword(){
    if(document.getElementById('passwordInput').value === CORRECT_PASSWORD){
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'flex';
        document.getElementById('bgMusic').play();
        initScratch();
    } else { alert('Galat password jaan 😢'); }
}

function next(n){
    document.getElementById('s'+n).style.display = 'none';
    document.getElementById('s'+(n+1)).style.display = 'flex';
}

function blowCandle(){
    document.getElementById('flame').classList.add('blown');
    document.getElementById('nextBtn3').style.display = 'inline-block';
}

// ========== SCRATCH LOGIC ==========
let canvas, ctx, isDrawing = false;
let scratchDone = false;

function initScratch(){
    canvas = document.getElementById('scratchCanvas');
    ctx = canvas.getContext('2d');

    ctx.fillStyle = '#888';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 30px Poppins';
    ctx.textAlign = 'center';
    ctx.fillText('SCRATCH KARO 👇', canvas.width/2, canvas.height/2);

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);
}

function startDraw(e){ isDrawing = true; draw(e); }
function stopDraw(){ isDrawing = false; }

function draw(e){
    if(!isDrawing || scratchDone) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;

    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI*2);
    ctx.fill();

    checkScratchProgress();
}

function checkScratchProgress(){
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let transparent = 0;
    for(let i=3; i<imageData.data.length; i+=4){
        if(imageData.data[i] < 128) transparent++;
    }
    let percent = (transparent / (canvas.width * canvas.height)) * 100;

    document.getElementById('progressText').innerText = Math.floor(percent) + '% ho gaya...';

    if(percent > 70 &&!scratchDone){
        scratchDone = true;
        document.getElementById('progressText').innerText = 'Shabash! Ab NEXT dabao ❤️';
        document.getElementById('nextBtn2').style.display = 'inline-block'; // button show
    }
}
</script>

</body>
</html>
