<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
    color:white;
  }
  .card{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 40px 60px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    animation: pop 1s ease;
  }
  @keyframes pop{
    0%{transform: scale(0.5); opacity:0;}
    100%{transform: scale(1); opacity:1;}
  }
  h1{
    font-size: 3rem;
    margin:0;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow{
    from{text-shadow: 0 0 10px #fff;}
    to{text-shadow: 0 0 30px #ffeb3b, 0 0 40px #ff9800;}
  }
  p{
    font-size: 1.3rem;
    margin-top:15px;
  }
  .cake{
    font-size: 5rem;
    animation: bounce 1s infinite;
  }
  @keyframes bounce{
    0%,100%{transform: translateY(0);}
    50%{transform: translateY(-15px);}
  }
  button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ffca28;
    color:#333;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
  }
  button:hover{ background:#fff; }
</style>
</head>
<body>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Happy Birthday!</h1>
  <p>Mere AC Wale Dost! 😎</p>
  <p>7 Fan Wale PC ki tarah tumhari life bhi cool rahe!</p>
  <p>Allah tumhe hamesha khush rakhe ❤️</p>
  <button onclick="party()">Cake Kha Lo 🎉</button>
</div>

<script>
function party(){
  alert("Happy Birthday Once Again! 🎉🎈 Party to banti hai!");
  document.body.style.background = `linear-gradient(135deg, #${Math.floor(Math.random()*16777215).toString(16)}, #${Math.floor(Math.random()*16777215).toString(16)})`;
}
</script>

</body>
</html>
